[build-system]
requires      = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "alterself"
version     = "1.0.0"
description = "A clean, pythonic Discord selfbot library with full browser fingerprint spoofing"
readme      = "README.md"
license     = "MIT"
requires-python = ">=3.11"

dependencies = [
    "aiohttp>=3.9.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
voice = [
    "PyNaCl>=1.5.0",
    "opuslib>=3.0.0",
]

[tool.setuptools.packages.find]
where   = ["."]
include = ["alterself*"]
exclude = ["tests*", "examples*", "docs*"]
